<!DOCTYPE html>
<html>
<head>
    <title>Age Restricted Form</title>

    <style>
       body{
    font-family: Arial, sans-serif;
    background-color: #dff6f0;
    margin: 15px;
    padding: 10px;
}

h1{
    text-align: center;
    color: #7b2cbf;
}

label{
    display: block;
    margin: 10px 0 5px;
}

input{
    width: 100%;
    padding: 8px;
    font-size: 16px;
    box-sizing: border-box;
    border: 1px solid #f08c46;
}

button{
    padding: 10px 15px;
    margin: 5px;
    background-color: #e85d04;
    color: white;
    border: 2px dashed #9d0208;
    cursor: pointer;
    font-weight: bold;
    font-size: 20px;
}

button:hover{
    background-color: #ffb703;
}

.container{
    width: 400px;
    margin: 50px auto;
    background-color: #fff3b0;
    padding: 20px;
    border-radius: 8px;
    box-shadow: 0 0 10px rgba(80, 80, 80, 0.5);
}
    </style>
</head>

<body>

    <main>
        <h1>Age Restricted Form</h1>

        <form class="container" id="ageForm">

            <label for="name">Name:</label>
            <input type="text" id="name" name="name" required>

            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required>

            <label for="age">Age:</label>
            <input type="number" id="age" name="age" required>

            <button type="submit">Submit</button>

        </form>
    </main>

    <script>

        document.getElementById("ageForm").addEventListener("submit", demoFunction);

        function demoFunction(event) {

            event.preventDefault();

            let name = document.getElementById("name").value;
            let age = document.getElementById("age").value;

            if (age < 18 && age > 0) {

                alert(name + ", You are under 18 years old. You cannot submit the form.");

            }
            else if (age <= 0) {

                alert(name + ", Please enter a valid age.");

            }
            else {

                alert(name + ", Thank you for submitting the form.");

            }
        }

    </script>

</body>
</html>
