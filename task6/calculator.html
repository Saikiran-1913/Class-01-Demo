<!DOCTYPE html>
<html>
<head>
    <title>JavaScript Calculator</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #e8f0fe;
            padding: 30px;
        }

        .calculator {
            width: 450px;
            margin: auto;
            background-color: #ffffff;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 0 10px #999999;
        }

        h1 {
            text-align: center;
            color: #7b2cbf;
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            box-sizing: border-box;
            font-size: 16px;
        }

        .result {
            margin-top: 20px;
            padding: 15px;
            background-color: #fff3b0;
            font-size: 20px;
            font-weight: bold;
        }

        button {
            padding: 10px 15px;
            margin: 5px;
            background-color: #e85d04;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background-color: #ffb703;
        }

        h3 {
            color: #333366;
            margin-top: 25px;
        }
    </style>
</head>

<body>

    <div class="calculator">

        <h1>JavaScript Calculator</h1>

        <label for="num1">First Number</label>
        <input type="number" id="num1" placeholder="Enter first number">

        <label for="num2">Second Number</label>
        <input type="number" id="num2" placeholder="Enter second number">

        <div class="result"> 
            Result:
            <span id="result">0</span>
        </div>

        <h3>Internal JavaScript</h3>

        <button onclick="addNumbers()">Add</button>
        <button onclick="subtractNumbers()">Subtract</button>

        <h3>External JavaScript</h3>

        <button id="multiplyBtn">Multiply</button>
        <button id="divideBtn">Divide</button>

        <h3>Inline JavaScript</h3>

        <button onclick="incrementNumber()">Increment First Number</button>

        <button onclick="
            document.getElementById('num1').value =
            Number(document.getElementById('num1').value) - 1;
        ">
            Decrement First Number
        </button>

        <button onclick="
            document.getElementById('num1').value = 0;
            document.getElementById('num2').value = 0;
            document.getElementById('result').textContent = 0;
        ">
            Clear
        </button>

    </div>


    <!-- Internal JavaScript -->

    <script>

        function addNumbers() {

            let a = Number(document.getElementById("num1").value);
            let b = Number(document.getElementById("num2").value);

            document.getElementById("result").textContent = a + b;
        }


        function subtractNumbers() {

            let a = Number(document.getElementById("num1").value);
            let b = Number(document.getElementById("num2").value);

            document.getElementById("result").textContent = a - b;
        }

    </script>


    <!-- External JavaScript -->

    <script src="external-script.js"></script>

</body>
</html>
